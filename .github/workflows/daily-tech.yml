name: daily-tech

# CHANNEL 2 — AI Chronicle (AI/tech news Shorts)
# 3 posts/day at news-prime times (09:30 / 13:30 / 21:30 UTC =
# 04:30 / 08:30 / 16:30 New York — early news, morning commute, evening recap).

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "30 13 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but don't upload"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-tech
  cancel-in-progress: false

jobs:
  produce:
    name: Tech daily Short
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID_TECH: ${{ secrets.YT_CLIENT_ID_TECH || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET_TECH: ${{ secrets.YT_CLIENT_SECRET_TECH || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_TECH: ${{ secrets.YT_REFRESH_TOKEN_TECH }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # ONE repository secret (FACTORY_ENV) carries all channel credentials.
      # The pipeline's config loader reads this .env file at import time.
      # (The per-secret env vars above still work if you prefer setting
      # them individually - env vars win, .env fills the gaps.)
      - name: Load channel secrets
        env:
          FACTORY_ENV: ${{ secrets.FACTORY_ENV }}
        run: printf '%s\n' "$FACTORY_ENV" > .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          ffmpeg -version | head -1

      - name: Run pipeline — tech
        run: python main.py --channel tech

      - name: Save topic history + bias
        if: success() && github.event.inputs.dry_run != 'true'
        run: bash scripts/push_history.sh tech

      - name: Upload artifacts (video + thumbnail + script)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-tech
          path: |
            work/tech/**/*.mp4
            work/tech/**/*.jpg
            work/tech/**/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert — create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The daily run for **tech** failed.
          Inspect the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _Auto-generated by tube-autopilot._"
          gh issue create \
            --title "❌ tech pipeline failed (run ${{ github.run_id }})" \
            --body "$BODY" || true
