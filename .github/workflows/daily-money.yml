name: daily-money

# CHANNEL — Wealth Signals : 5 posts/day (4 Shorts + 1 long-form video)
# Slots at 05:45 09:45 13:45 17:45 21:45 UTC.
# Each trigger ships the NEXT video of the day (slot-aware, no repeats);
# the day's 5th slot (21:45 UTC) renders as a 16:9 long-form video
# (= 9:30pm Cairo summer / 5:30pm New York — US evening prime).

on:
  schedule:
    - cron: "45 5 * * *"
    - cron: "45 9 * * *"
    - cron: "45 13 * * *"
    - cron: "45 17 * * *"
    - cron: "45 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render but don't upload"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-money
  cancel-in-progress: false

jobs:
  produce:
    name: Wealth Signals daily post
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_KEY_MONEY || secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID_MONEY: ${{ secrets.YT_CLIENT_ID_MONEY || secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET_MONEY: ${{ secrets.YT_CLIENT_SECRET_MONEY || secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN_MONEY: ${{ secrets.YT_REFRESH_TOKEN_MONEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      # ONE repository secret (FACTORY_ENV) carries all channel credentials.
      # The pipeline's config loader reads this .env file at import time.
      # (The per-secret env vars above still work if you prefer setting
      # them individually - env vars win, .env fills the gaps.)
      - name: Load channel secrets
        env:
          FACTORY_ENV: ${{ secrets.FACTORY_ENV }}
        run: printf '%s\n' "$FACTORY_ENV" > .env

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # ubuntu-latest runners ship NO ffmpeg -> install it, and
          # imageio-ffmpeg (pip) is the built-in fallback either way
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -c "from src.utils import ffmpeg_exe; print('ffmpeg ready:', ffmpeg_exe())"

      - name: Run pipeline — money
        run: python main.py --channel money

      - name: Save topic history + bias
        if: success() && github.event.inputs.dry_run != 'true'
        run: bash scripts/push_history.sh money

      - name: Upload artifacts (video + thumbnail + script)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-money
          path: |
            work/money/**/*.mp4
            work/money/**/*.jpg
            work/money/**/script.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert — create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="The daily run for **money** failed.
          Inspect the full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          _Auto-generated by tube-autopilot._"
          gh issue create \
            --title "❌ money pipeline failed (run ${{ github.run_id }})" \
            --body "$BODY" || true
